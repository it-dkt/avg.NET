services:
  avg_db_server:
    image: mysql:8.4
    environment:
       - MYSQL_ROOT_PASSWORD=root
    volumes:
       - ./mysql-setting/initdb.en.d:/docker-entrypoint-initdb.d
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    restart: always
    # ready after the init script has finished (the server for the init script doesn't listen on TCP)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
#    ports:
#       - "3306:3306"
  avg_dotnet_app:
    depends_on:
      avg_db_server:
        condition: service_healthy
    environment:
       - ASPNETCORE_ENVIRONMENT=Development
    build: .
    ports:
       - "80:8080"
