<!DOCTYPE html><html><head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,user-scalable=0">
	<script src="/audio/bgm.js"></script>
	<title>A Tale of Yatsuka Village</title>
	<link rel="stylesheet" type="text/css" href="../avg.css">
	<style>
		.mincho {
			font-family: Georgia, "Times New Roman", serif;
		}
		#ending-area {
			position: relative;
			margin: 10px;
			width: 538px;
			height: 180px;
			border: solid 1px white;
			overflow: hidden;
		}
		#ending-area img {
			position: absolute;
			left: 0; top: 0;
			opacity: 0;
			animation: fadein 4s forwards;
		}
		#ending-kan {
			position: absolute;
			top: 12px; left: 0;
			width: 538px;
			text-align: center;
			font-size: 24px;
			letter-spacing: 0.3em;
			color: #fff8ec;
			text-shadow: 0 0 10px rgba(120, 60, 40, 0.9);
			opacity: 0;
			animation: fadein 3s 2s forwards;
		}
		#roll-area {
			position: relative;
			margin: 0 10px 10px 10px;
			width: 538px;
			height: 100px;
			border: solid 1px white;
			overflow: hidden;
			cursor: pointer;
		}
		#roll {
			position: absolute;
			top: 100px;
			width: 538px;
			animation: roll 40s 4s linear forwards;
		}
		#roll.skip {
			animation: none;
			transform: translateY(calc(-100% - 100px));
		}
		#roll p, #roll h3 {
			text-align: center;
			line-height: 1.9;
		}
		#roll h3 {
			margin-top: 18px;
			font-size: 13px;
			color: #b8a8a0;
			letter-spacing: 0.3em;
		}
		#roll p {
			font-size: 14px;
		}
		#roll .big {
			font-size: 22px;
			letter-spacing: 0.3em;
		}
		#roll .gap {
			margin-top: 28px;
		}
		#to-title {
			position: absolute;
			top: 0; left: 0;
			width: 538px;
			height: 100px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			opacity: 0;
			transition: opacity 2s;
			pointer-events: none;
		}
		#to-title.show {
			opacity: 1;
			pointer-events: auto;
		}
		#to-title p {
			text-align: center;
			font-size: 13px;
			color: #b8a8a0;
			margin-bottom: 12px;
			letter-spacing: 0.2em;
		}
		#to-title a {
			color: white;
			text-decoration: none;
			font-size: 16px;
			letter-spacing: 0.2em;
			padding: 2px 12px;
		}
		#to-title a:hover {
			color: black;
			background-color: white;
		}
		@keyframes fadein {
			to { opacity: 1; }
		}
		@keyframes roll {
			from { transform: translateY(0); }
			to { transform: translateY(calc(-100% - 100px)); }
		}
	</style>
</head>
<body>
	<div id="main-area">
		<div id="ending-area">
			<img src="../img/ending.jpg" alt="">
			<div id="ending-kan" class="mincho">― THE END ―</div>
		</div>
		<div id="roll-area" title="Click to skip">
			<div id="roll" class="mincho">
				<p class="big">A Tale of Yatsuka Village</p>

				<h3>STAFF</h3>
				<p>Producer　it-dkt</p>
				<p>Scenario　Claude</p>
				<p>Background Art　Claude</p>
				<p>Music　Claude</p>
				<p>Character Art　ChatGPT</p>

				<p class="gap">May Sayo's soul rest in peace.</p>
				<p class="gap">Thank you for playing.</p>
			</div>
			<div id="to-title">
				<p>They say the fog over Yatsuka Village has never lifted...</p>
				<a href="/" class="mincho">Back to Title</a>
			</div>
		</div>
	</div>
	<audio id="bgm-audio" src="/audio/bgm-true-end.mp3" data-track="true-end" loop preload="auto"></audio>

	<script>
		// the game is over: clear the player's flag (same key as avg.js)
		sessionStorage.removeItem('AVG_FLAG_KEY');

		const roll = document.getElementById('roll');
		const toTitle = document.getElementById('to-title');

		const finishRoll = function () {
			roll.classList.add('skip');
			toTitle.classList.add('show');
		};

		roll.addEventListener('animationend', finishRoll);
		// click the roll to skip it
		document.getElementById('roll-area').addEventListener('click', finishRoll);
	</script>
</body></html>
